name: smartstorehub
description: SmartStoreHub - Smart Super Shop POS & Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  crypto: ^3.0.3
  intl: ^0.19.0
  mobile_scanner: ^5.2.3
  barcode_widget: ^2.0.4
  share_plus: ^10.1.4
  http: ^1.2.2
  android_id: ^0.4.0
  file_picker: ^8.1.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
