{"name":"Build APK","on":{"push":{},"workflow_dispatch":{}},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"subosito/flutter-action@v2","with":{"channel":"stable"}},{"run":"cp pubspec.yaml /tmp/pubspec.yaml && flutter create --platforms=android --project-name smartstorehub --org com.hasan.smartstorehub . && cp /tmp/pubspec.yaml pubspec.yaml && rm -rf test"},{"run":"flutter pub get && dart run flutter_launcher_icons"},{"run":"sed -i 's#<application#<uses-permission android:name=\"android.permission.CAMERA\"/>\\n    <application#' android/app/src/main/AndroidManifest.xml && sed -i 's#android:label=\"[^\"]*\"#android:label=\"SmartStoreHub\"#' android/app/src/main/AndroidManifest.xml"},{"run":"flutter build apk --release"},{"uses":"actions/upload-artifact@v4","with":{"name":"SmartStoreHub-APK","path":"build/app/outputs/flutter-apk/app-release.apk"}}]}}}
